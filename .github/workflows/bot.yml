name: AndroBot

on:
  workflow_dispatch:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  respond:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run AndroBot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOUS_AGENT_KEY: ${{ secrets.NOUS_AGENT_KEY }}
          NOUS_REFRESH_TOKEN: ${{ secrets.NOUS_REFRESH_TOKEN }}
          LLM_PROVIDER: auto
          LLM_MODEL: tencent/hy4-flash:free
          OLLAMA_URL: http://127.0.0.1:11434
        run: python3 bot.py