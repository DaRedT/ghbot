name: AndroBot

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  respond:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run AndroBot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOUS_REFRESH_TOKEN: ${{ secrets.NOUS_REFRESH_TOKEN }}
          LLM_PROVIDER: nous
          LLM_MODEL: tencent/hy4-flash:free
        run: python3 bot.py